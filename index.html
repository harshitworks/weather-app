<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="icon" href="./images/favicon.png">
  </head>
  <body>
    <div class="outerbox">
      <div class="card0">
        <div class="search">
            <i
            class="fa-solid fa-magnifying-glass"
            style="color: rgb(255, 255, 255)"
            ></i>
            <input id="search-city"  type="text" placeholder="Search City" />
        </div>
      </div>
      <div class="card1">
        <div class="location">
          <div class="location-box"> 
            <span class="text"> 
              <i class="fa-solid fa-location-dot" style="color: rgb(30, 48, 80);"></i>
              <p id="text1" style="padding-left: 7px;">Greater Noida</p> 
            </span>
            <span class="convert">
              <button id="f">F</button>
              <button id="c">C</button>
            </span>
          </div>
        </div>
        <div class="temperature">
          <p id="now">Now</p>
          <div id="weather">Weather</div>
          <div class="curr-temp"> </div>
        </div>
        <div class="weather-image">
          <div id="curr-image"></div>
        </div>

      </div>
      <div class="card2">
        <div class="card21">
          <div class="card211"> <p>Today/Week</p></div>
          <div class="card212">

            <div class="card2121">
               <p id="time">Now</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp"> 24 °C</p>
              </div>

            <div class="card2122">
              <p id="time">1 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p>
            </div>
            <div class="card2123">
              <p id="time">2 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p>
            </div>
            <div class="card2124">
              <p id="time">3 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p>
            </div>
            <div class="card2125"> 
              <p id="time">4 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p></div>
          </div>
          <div class="card213">
            <div class="card2131">

              <p id="tomorrow"> Tomorrow </p>
              <p id="tomorrow-temp"> 30 °C</p>
              <div id="next-image" > </div>
            </div>

          </div>
        </div>
        <div class="card22">
          <div class="card221">
            <div class="sunrise"> 
              <p >Sunrise</p>
              <p id="time1"></p>
            </div>
            <div class="sunset"> <p >Sunset</p>
              <p id="time2"></p></div>
            <div class="daylength">
               <p >Day Length</p>
              <p id="time3"></p></div>
          </div>
        </div>
      </div>
      <div class="card3">
        <div class="card31">
          <p>Today's Highlights</p>
        </div>
        <div class="card32"> 
          <p> Chances Of Rain</p>
          <div class="graph">
            <div class="bar" style="height:40%"></div>
            <div class="bar" style="height:80%"></div>
            <div class="bar" style="height:60%"></div>
            <div class="bar" style="height:90%"></div>
            <div class="bar" style="height:50%"></div>
            <div class="bar" style="height:60%"></div>
        </div>
        <div class="rain-time"> </div>
        </div>
        <div class="card33">
           <p> UV Index</p>
           <svg width="100%" height="50%" class="uv">
            <path
                d="M20 100 A80 80 0 0 1 200 100"
                stroke="white"
                stroke-width="7"
                fill="none"
            />
            <path
                id="uv"
                d="M20 100 A80 80 0 0 1 200 100"
                stroke="lime"
                stroke-width="7"
                fill="none"
            />
        </svg>
        <p id="uv-index"> 3/10</p>
          </div>
        <div class="card34">
            <p> Wind Status</p>  
            <div class="wind-bars">
              <div class="wind w1" style="height:80%" ></div>
              <div class="wind w2" style="height:45%"></div>
              <div class="wind w3" style="height:50%"></div>
              <div class="wind w4" style="height:90%"></div>
              <div class="wind w5" style="height:60%"></div>
              <div class="wind w6" style="height:50%"></div>
              <div class="wind w7" style="height:90%"></div>
              <div class="wind w8" style="height :55%"></div>
              <div class="wind w9" style="height:80%"></div>
              <div class="wind w10" style="height:40%"></div>
            </div>
          <p id="windSpeed"> </p>

          </div>
        <div class="card35">
           <p> Humidity</p>
           <div id="humidity-image"> </div>
           <p id="humidity"> 50%</p>

          </div>
      </div>
      <div class="card4">
        <p id="card41">Nearby Cities</p>
        <div class="card411">
          <div class="card42">
            <p id="other1">20 °C</p>
            <p id="othercity1"> Mirzapur Nagli</p>
          </div>
          <div class="card43">
            <p id="other2">23 °C</p>
            <p id="othercity2"> Bijnor</p>
          </div>
        </div>
        
      </div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
