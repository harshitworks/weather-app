<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="icon" href="./images/favicon.png">
  </head>
  <body>
    <div class="outerbox">
      <div class="card0">
        <div class="search">
            <i
            class="fa-solid fa-magnifying-glass"
            style="color: rgb(255, 255, 255)"
            ></i>
            <input id="search-city"  type="text" placeholder="Search City" />
        </div>
      </div>
      <div class="card1">
        <div class="location">
          <div class="location-box"> 
            <span class="text"> 
              <i class="fa-solid fa-location-dot" style="color: rgb(30, 48, 80);"></i>
              <p id="text1" style="padding-left: 7px;">Greater Noida</p> 
            </span>
            <span class="convert">
              <button id="f">F</button>
              <button id="c">C</button>
            </span>
          </div>
        </div>
        <div class="temperature">
          <p id="now">Now</p>
          <div id="weather">Weather</div>
          <div class="curr-temp"> </div>
        </div>
        <div class="weather-image">
          <div id="curr-image"></div>
        </div>

      </div>
      <div class="card2">
        <div class="card21">
          <div class="card211"> <p>Today/Week</p></div>
          <div class="card212">

            <div class="card2121">
               <p id="time">Now</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp"></p>
              </div>

            <div class="card2122">
              <p id="time">1 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p>
            </div>
            <div class="card2123">
              <p id="time">2 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p>
            </div>
            <div class="card2124">
              <p id="time">3 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p>
            </div>
            <div class="card2125"> 
              <p id="time">4 PM</p> 
              <img src="images/thermometer.png" alt="temp">
              <p id="hourly-temp">24 °C</p></div>
          </div>
          <div class="card213">
            <div class="card2131">

              <p id="tomorrow"> Tomorrow </p>
              <p id="tomorrow-temp"> 30 °C</p>
              <img src="images/lighting.png" alt="temp">
            </div>

          </div>
        </div>
        <div class="card22">
          <div class="card221">
            <div class="sunrise"> 
              <p >Sunrise</p>
              <p id="time1"></p>
            </div>
            <div class="sunset"> <p >Sunset</p>
              <p id="time2"></p></div>
            <div class="daylength">
               <p >Day Length</p>
              <p id="time3"></p></div>
          </div>
        </div>
      </div>
      <div class="card3"></div>
      <div class="card4"></div>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
